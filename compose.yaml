services:
  mongodb:
    image: mongo:8.0
    container_name: oficina-execution-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-oficina_execution}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-oficina_execution}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-oficina_execution}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  execution-service:
    build:
      context: .
    container_name: oficina-execution-service
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-oficina_execution}
      MONGO_USERNAME: ${MONGO_USERNAME:-oficina_execution}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-oficina_execution}
      MONGO_AUTH_DATABASE: admin
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongodb-data:
