spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:execution}
    password: ${RABBITMQ_PASSWORD:execution_local}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        missing-queues-fatal: false
        prefetch: 1
        default-requeue-rejected: true
  data:
    mongodb:
      auto-index-creation: true
  application:
    name: tech-challenge-oficina-execution-service
  mongodb:
    uri: mongodb://${MONGO_USERNAME:oficina_execution}:${MONGO_PASSWORD:oficina_execution}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:oficina_execution}?authSource=${MONGO_AUTH_DATABASE:admin}&replicaSet=rs0&directConnection=true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,mongo
        liveness:
          include: livenessState
  endpoints:
    web:
      exposure:
        include: health
  health:
    rabbit:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mongo:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui/index.html

execution:
  security:
    jwt:
      issuer: ${EXECUTION_JWT_ISSUER:}
      audience: ${EXECUTION_JWT_AUDIENCE:}
      jwks-uri: ${EXECUTION_JWT_JWKS_URI:}
  messaging:
    enabled: ${COMMAND_CONSUMER_ENABLED:true}
    confirm-timeout: ${RABBITMQ_CONFIRM_TIMEOUT:5s}
    retry-delay: ${COMMAND_RETRY_DELAY:5s}
    max-deliveries: ${COMMAND_MAX_DELIVERIES:5}
  outbox:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    fixed-delay: ${OUTBOX_FIXED_DELAY:5s}
    batch-size: ${OUTBOX_BATCH_SIZE:10}
    lease-duration: ${OUTBOX_LEASE_DURATION:1m}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    initial-backoff: ${OUTBOX_INITIAL_BACKOFF:10s}
    max-backoff: ${OUTBOX_MAX_BACKOFF:5m}
