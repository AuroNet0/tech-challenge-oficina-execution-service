spring:
  data:
    mongodb:
      auto-index-creation: true
  application:
    name: tech-challenge-oficina-execution-service
  mongodb:
    uri: mongodb://${MONGO_USERNAME:oficina_execution}:${MONGO_PASSWORD:oficina_execution}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:oficina_execution}?authSource=${MONGO_AUTH_DATABASE:admin}&replicaSet=rs0&directConnection=true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,mongo
        liveness:
          include: livenessState
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mongo:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
